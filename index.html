<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CN Text Files</title>
  <!-- Prism.js for syntax highlighting -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.css"
    rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="container">
    <h1>CN Text Files</h1>
    <p>Each topic has two options: Copy Code and View Code.</p>

    <div class="topics-container">

      <!-- Directed Unweighted Graph -->
      <div class="topic-section">
        <h2>Directed Unweighted Graph</h2>
        <div class="topic-buttons">
          <button class="copy-btn" data-file="Directed Unweighted.txt" data-action="copy">
            Copy Code
          </button>
          <button class="view-btn" data-file="Directed Unweighted.txt" data-action="view">
            View Code
          </button>
        </div>
      </div>

      <!-- Directed Weighted Graph -->
      <div class="topic-section">
        <h2>Directed Weighted Graph</h2>
        <div class="topic-buttons">
          <button class="copy-btn" data-file="Directed Weighted.txt" data-action="copy">
            Copy Code
          </button>
          <button class="view-btn" data-file="Directed Weighted.txt" data-action="view">
            View Code
          </button>
        </div>
      </div>

      <!-- Undirected Unweighted Graph -->
      <div class="topic-section">
        <h2>Undirected Unweighted Graph</h2>
        <div class="topic-buttons">
          <button class="copy-btn" data-file="Undirected Unweighted.txt" data-action="copy">
            Copy Code
          </button>
          <button class="view-btn" data-file="Undirected Unweighted.txt" data-action="view">
            View Code
          </button>
        </div>
      </div>

      <!-- Single Source Single Destination -->
      <div class="topic-section">
        <h2>Single Source Single Destination</h2>
        <div class="topic-buttons">
          <button class="copy-btn" data-file="Single Source Single.txt" data-action="copy">
            Copy Code
          </button>
          <button class="view-btn" data-file="Single Source Single.txt" data-action="view">
            View Code
          </button>
        </div>
      </div>

      <!-- Single Source All Destinations -->
      <div class="topic-section">
        <h2>Single Source All Destinations</h2>
        <div class="topic-buttons">
          <button class="copy-btn" data-file="Single Source All.txt" data-action="copy">
            Copy Code
          </button>
          <button class="view-btn" data-file="Single Source All.txt" data-action="view">
            View Code
          </button>
        </div>
      </div>

      <!-- M/M/1 Queue -->
      <div class="topic-section">
        <h2>M/M/1 Queue</h2>
        <div class="topic-buttons">
          <button class="copy-btn" data-file="MM1.txt" data-action="copy">
            Copy Code
          </button>
          <button class="view-btn" data-file="MM1.txt" data-action="view">
            View Code
          </button>
        </div>
      </div>

      <!-- M/M/1/N Queue -->
      <div class="topic-section">
        <h2>M/M/1/N Queue</h2>
        <div class="topic-buttons">
          <button class="copy-btn" data-file="MM1N.txt" data-action="copy">
            Copy Code
          </button>
          <button class="view-btn" data-file="MM1N.txt" data-action="view">
            View Code
          </button>
        </div>
      </div>

    </div>

    <!-- Content display area for viewing files -->
    <div id="content-display" class="content-display hidden">
      <div class="content-header">
        <h3 id="content-title"></h3>
        <div class="header-controls">
          <button id="copy-current" class="header-btn" title="Copy Content">
            📋
          </button>
          <button id="close-content" class="close-btn">×</button>
        </div>
      </div>
      <div id="content-body" class="content-body">
        <div id="theory-content" class="theory-view hidden"></div>
        <div id="code-content" class="code-view hidden">
          <pre class="line-numbers"><code id="code-block" class="language-matlab"></code></pre>
        </div>
      </div>
    </div>

    <div id="status-message"></div>
  </div>

  <!-- Marked.js for markdown parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Prism.js for syntax highlighting -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>
  <script src="script.js"></script>
</body>

</html>
